<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="hotlineRad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF4E8" />
      <stop offset="100%" stop-color="#F2EBE3" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#hotlineRad)" />
  <rect x="12" y="12" width="476" height="476" rx="16" fill="none" stroke="#D4C5B3" stroke-width="2" />

  <!-- Outer circular badge with postal stamps -->
  <circle cx="250" cy="230" r="140" fill="#EBF4EF" stroke="#0A5C36" stroke-width="3" stroke-dasharray="6 4" />
  
  <!-- Phone icon & signal rings -->
  <g transform="translate(195, 175) scale(1.1)">
    <path
      d="M20 18C20 18 22 15 27 19L33 25C35 29 34 32 31 34L28 37C28 37 32 46 41 55C50 64 59 68 59 68L62 65C64 62 67 61 71 63L77 69C82 74 79 77 79 77C76 83 67 86 58 83C47 79 33 69 22 58C11 47 1 33 -2 22C-4 13 -1 4 5 1C5 1 11 -2 16 1"
      fill="#0A5C36"
    />
  </g>

  <!-- Toll Free Text Banner -->
  <g transform="translate(100, 390)">
    <rect width="300" height="54" rx="8" fill="#0A5C36" />
    <text x="150" y="26" font-family="monospace" font-size="11" font-weight="bold" fill="#EBF4EF" text-anchor="middle">
      TOLL-FREE PUBLIC HOTLINE
    </text>
    <text x="150" y="44" font-family="monospace" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      DIAL 6232 (NCDC)
    </text>
  </g>

  <!-- Verified rubber stamp -->
  <g transform="translate(300, 100) rotate(12)">
    <rect width="130" height="38" rx="4" fill="#F0FDF4" stroke="#15803D" stroke-width="2" />
    <text x="65" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">
      FREE OF CHARGE
    </text>
  </g>
</svg>
