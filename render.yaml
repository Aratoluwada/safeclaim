services:
  # ==============================================================
  # SafeClaim FastAPI Backend (Python 3.11 Web Service)
  # ==============================================================
  - type: web
    name: safeclaim-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m safeclaims.ingest
    startCommand: uvicorn safeclaims.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: RETRIEVAL_SIMILARITY_THRESHOLD
        value: "0.11"
      - key: LLM_MODEL
        value: "qwen-2.5-32b"
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: LLM_API_KEY
        sync: false
      - key: SAFECLAIM_ADMIN_TOKEN
        generateValue: true
      - key: SAFECLAIM_WEBHOOK_TOKEN
        generateValue: true

  # ==============================================================
  # SafeClaim React/Vite Frontend (Static Site)
  # ==============================================================
  - type: web
    name: safeclaim-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://safeclaim-backend.onrender.com"

