services:
  # ==============================================================
  # SafeClaim FastAPI Backend (Python 3.11 Web Service)
  # ==============================================================
  - type: web
    name: safeclaim-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m safeclaims.ingest
    startCommand: uvicorn safeclaims.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: RETRIEVAL_SIMILARITY_THRESHOLD
        value: "0.11"
      - key: LLM_MODEL
        value: "qwen2.5:7b-instruct"
      - key: LLM_BASE_URL
        value: "http://localhost:11434/v1"
      - key: LLM_API_KEY
        value: "ollama"

  # ==============================================================
  # SafeClaim React/Vite Frontend (Static Site)
  # ==============================================================
  - type: web
    name: safeclaim-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: safeclaim-backend
          property: host
